name: M4 Competition daily scan

on:
  workflow_dispatch:
  schedule:
    # Backup only — the primary trigger is the daily Claude session at 4pm UK,
    # which dispatches this workflow and publishes the page afterwards. This
    # backup fires later (16:40 UTC) so data still refreshes if that session
    # ever fails to run. 15:xx UTC = 4pm UK during BST.
    - cron: "40 16 * * *"

permissions:
  contents: write

concurrency:
  group: m4-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bmw-m4-m3-search-9cjc9p

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run scan
        run: node m4-search/scripts/scan.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m4-search/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "m4-search: daily scan $(date -u +%F)"
            git push
          fi
