name: M4 Competition daily scan

on:
  workflow_dispatch:
  push:
    branches: [claude/bmw-m4-m3-search-9cjc9p]
    paths:
      - "m4-search/.trigger"
      - ".github/workflows/m4-scan.yml"
      - "m4-search/scripts/scan.mjs"

permissions:
  contents: write

concurrency:
  group: m4-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bmw-m4-m3-search-9cjc9p

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run scan
        run: node m4-search/scripts/scan.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m4-search/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "m4-search: daily scan $(date -u +%F)"
            git push
          fi
